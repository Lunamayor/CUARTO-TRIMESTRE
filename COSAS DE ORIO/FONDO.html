<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perfil</title>

<style>
    /* ===========================
       RESET Y TIPOGRAFÍA
       =========================== */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

  body {
    color: #333;

    background:
        radial-gradient(circle at 20% 20%, #4c6fb7 0%, transparent 35%),
        radial-gradient(circle at 80% 80%, #1b2d57 0%, transparent 40%),
        linear-gradient(135deg, #3C5B8F, #112250);

    background-repeat: no-repeat;
    background-attachment: fixed;
}
    /* ===========================
       CONTAINER PRINCIPAL
       =========================== */
    .container {
        display: flex;
        min-height: 100vh;
    }

    /* ===========================
       SIDEBAR
       =========================== */
    .sidebar {
        width: 260px;
        background: #112250;
        color: #fff;
        padding: 30px 20px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        box-shadow: 3px 0 10px rgba(0,0,0,0.1);
    }

    .user-box {
        text-align: center;
        margin-bottom: 40px;
    }

    .user-img {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        border: 3px solid #E0C58F;
        object-fit: cover;
        box-shadow: 0 0 15px rgba(0,0,0,0.2);
    }

    .welcome {
        margin-top: 15px;
        font-size: 16px;
        font-weight: 600;
        color: #E0C58F;
    }

    .menu {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .menu-item {
        padding: 12px 18px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 15px;
        transition: 0.3s;
        text-decoration: none;
        color: #fff;
    }

    .menu-item:hover {
        background: #E0C58F;
        color: #112250;
        font-weight: bold;
    }

    .menu-item.active {
        background: #E0C58F;
        color: #112250;
        font-weight: bold;
    }

    .logout {
        margin-top: 40px;
        opacity: 0.8;
        color: #D9CBC2;
        cursor: pointer;
        transition: 0.3s;
    }

    .logout:hover {
        color: #E0C58F;
    }

    /* ===========================
       CONTENIDO PRINCIPAL
       =========================== */
    .content {
        flex: 1;
        padding: 50px 60px;
        overflow-y: auto;
    }

    .title {
        font-size: 28px;
        font-weight: 700;
        margin-bottom: 10px;
        color: #112250;
    }

    .subtitle {
        color: #555;
        margin-bottom: 30px;
        font-size: 15px;
        line-height: 1.5;
    }

    /* ===========================
       FOTO DE PERFIL
       =========================== */
  .photo-box {
    margin-bottom: 50px;
    background: #fff;
    padding: 50px 40px;
    border-radius: 15px;
    box-shadow: 5 10px 30px rgba(0,0,0,0.1);

    display: flex;
    flex-direction: column;
    align-items: center;
}


    .profile-preview {
        width: 180px;
        height: 180px;
        border-radius: 50%;
        object-fit: cover;
        border: 3px solid #E0C58F;
        box-shadow: 0 5px 15px rgba(0,0,0,0.15);
    }

    .upload-btn {
    margin-top: 43px; /* antes 20px */
    background: #E0C58F;
    border: none;
    padding: 12px 28px;
    font-weight: 600;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.3s;
    color: #112250;
    font-size: 14px;
}

    .upload-btn:hover {
        background: #D9B973;
    }

    .min-info {
        margin-top: 12px;
        color: #888;
        font-size: 13px;
    }

    /* ===========================
       FORMULARIOS
       =========================== */
    .section-title {
        margin: 25px 0 15px 0;
        font-size: 20px;
        font-weight: 600;
        color: #112250;
    }

    .form {
        background: #fff;
        padding: 25px;
        border-radius: 15px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        margin-bottom: 30px;
    }

    .row {
        display: flex;
        gap: 20px;
        margin-bottom: 15px;
    }

    .field {
        flex: 1;
        display: flex;
        flex-direction: column;
    }

    label {
        font-size: 14px;
        color: #333;
        margin-bottom: 5px;
    }

    input {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid #D9CBC2;
        border-radius: 8px;
        font-size: 14px;
        transition: 0.3s;
    }

    input:focus {
        outline: none;
        border-color: #E0C58F;
        box-shadow: 0 0 5px rgba(224,197,143,0.5);
    }

    /* ===========================
       MEDIA QUERIES
       =========================== */
    @media (max-width: 1024px) {
        .container {
            flex-direction: column;
        }

        .sidebar {
            width: 100%;
            flex-direction: row;
            justify-content: space-around;
            padding: 15px 0;
        }

        .content {
            padding: 30px 20px;
        }

        .photo-box, .form {
            padding: 20px;
        }

        .row {
            flex-direction: column;
        }
    }

</style>
</head>
<body>

<div class="container">

    <!-- SIDEBAR -->
    <aside class="sidebar">
       

        <nav class="menu">
            <a class="menu-item active">Mi perfil</a>
            <a class="menu-item">Configuración</a>
            <a class="menu-item">Seguridad</a>
        </nav>

        <p class="logout">Cerrar sesión</p>
    </aside>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="content">

        <h2 class="title">Foto de perfil</h2>
        <p class="subtitle">Sube tu foto de perfil. Un retrato en primer plano es ideal. Evita poner logos.</p>

        <div class="photo-box">
            <img src="https://via.placeholder.com/180" class="profile-preview">
            <button class="upload-btn">Subir foto de perfil</button>
            
        </div>

        <h3 class="section-title">Datos de usuario</h3>
        <form class="form">
            <div class="row">
                <div class="field">
                    <label>Nombre</label>
                    <input type="text" value="...">
                </div>
                <div class="field">
                    <label>Teléfono</label>
                    <input type="text">
                </div>
            </div>
            <div class="row">
                <div class="field">
                    <label>Apellido</label>
                    <input type="text">
                </div>
            </div>
            <div class="row">
                <div class="field">
                    <label>Correo</label>
                    <input type="email" value="...">
                </div>
            </div>
        </form>

        <h3 class="section-title">Redes sociales</h3>
        <form class="form">
            <div class="row">
                <div class="field">
                    <label>Perfil Facebook URL</label>
                    <input type="text">
                </div>
                <div class="field">
                    <label>Instagram URL</label>
                    <input type="text">
                </div>
            </div>
        </form>

    </main>

</div>

</body>
</html>
