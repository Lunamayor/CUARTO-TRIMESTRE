{% extends "base.html" %}

{% block content %}

<!-- ENCABEZADO DE LA PÁGINA -->
<div class="header">
  <h1>Bienvenido Usuario</h1> <!-- Título principal -->
</div>

<!-- BARRA DE BÚSQUEDA -->
<div class="search-bar">
  <i class="fas fa-search"></i> <!-- Icono de lupa -->
  
  <!-- Campo donde el usuario puede buscar reportes -->
  <input 
    type="text" 
    placeholder="Buscar objeto perdido o encontrado..."
  >
</div>

<!-- TARJETAS RESUMEN DEL ESTADO DE LOS REPORTES -->
<div class="cards">

  <!-- Cantidad total de reportes relacionados con el usuario -->
  <div class="card">
    <h3>12</h3>
    <span>Reportes totales</span>
  </div>

  <!-- Reportes que ya lograron recuperarse -->
  <div class="card">
    <h3>5</h3>
    <span>Recuperados</span>
  </div>

</div>

{% endblock %}
