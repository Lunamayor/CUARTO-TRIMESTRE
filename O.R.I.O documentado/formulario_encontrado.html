{% extends 'base.html' %}

<!-- Título que aparecerá en la pestaña del navegador -->
{% block title %}Registrar objeto encontrado{% endblock %}

{% block extra_css %}
<!-- Hoja de estilos específica para este formulario -->
<link rel="stylesheet" href="{{ url_for('static', filename='css/form_encontrado.css') }}">
{% endblock %}

{% block content %}

<!-- Contenedor principal del fondo y animaciones -->
<div id="malasPracticas">

    <!-- =========================
         estrellas para fondo
         ========================= -->
    <div class="star" style="top:5%; left:5%; width:2px; height:2px; animation-duration:1.5s;"></div>
    <div class="star" style="top:10%; left:20%; width:1.5px; height:1.5px; animation-duration:2s;"></div>
    <div class="star" style="top:15%; left:35%; width:2.5px; height:2.5px; animation-duration:2.2s;"></div>
    <div class="star" style="top:20%; left:50%; width:1.8px; height:1.8px; animation-duration:1.8s;"></div>
    <div class="star" style="top:25%; left:65%; width:2.2px; height:2.2px; animation-duration:1.9s;"></div>
    <div class="star" style="top:30%; left:80%; width:2px; height:2px; animation-duration:2.5s;"></div>
    <div class="star" style="top:35%; left:10%; width:1.7px; height:1.7px; animation-duration:2.1s;"></div>
    <div class="star" style="top:40%; left:25%; width:2.3px; height:2.3px; animation-duration:2.2s;"></div>
    <div class="star" style="top:45%; left:40%; width:2px; height:2px; animation-duration:2.3s;"></div>
    <div class="star" style="top:50%; left:55%; width:1.5px; height:1.5px; animation-duration:1.7s;"></div>
    <div class="star" style="top:55%; left:70%; width:2px; height:2px; animation-duration:2s;"></div>
    <div class="star" style="top:60%; left:85%; width:2.5px; height:2.5px; animation-duration:2.1s;"></div>

    <!-- =========================
         contenedor del formulario
         ========================= -->
    <div class="form-container">

        <!-- Botón para regresar a la página anterior -->
        <div class="back-btn-container">
            <button type="button" class="btn-config back-btn"
                onclick="(document.referrer ? history.back() : window.location='/menu')">
                ← Volver
            </button>
        </div>

        <!-- Encabezado del formulario -->
        <div class="form-header">
            <!-- Logo del sistema -->
            <img src="{{ url_for('static', filename='img/logo_orio.png') }}" alt="Logo" class="logo">
            <h1>Registro de Objetos Encontrados</h1>
        </div>

        <!-- =========================
             aqui esta el formulario de reporte
             ========================= -->
        <form id="reportForm" enctype="multipart/form-data">

            <!-- División en dos columnas -->
            <div class="form-columns">

                <!-- COLUMNA IZQUIERDA -->
                <div class="left-column">

                    <label>Nombre del objeto</label>
                    <input type="text" id="nombre_objeto" name="nombre_objeto" maxlength="66" required>

                    <label class="multiple">Estado del objeto</label>
                    <div class="select-wrap">
                        <select id="estado" name="estado" required>
                            <option value="Bueno">Bueno</option>
                            <option value="Regular">Regular</option>
                            <option value="Malo">Malo</option>
                        </select>
                    </div>

                    <label>Color dominante</label>
                    <input type="text" id="color_dominante" name="color_dominante" maxlength="22" required>

                    <label>Lugar donde encontro el objeto</label>
                    <input type="text" name="lugar" required>

                </div>

                <!-- COLUMNA DERECHA -->
                <div class="right-column">

                    <label>Fecha de encuentro del objeto</label>
                    <input type="date" id="fecha" name="fecha" required>

                    <label>Ficha del aprendiz</label>
                    <input type="number" id="ficha" name="ficha" required>

                    <!-- Selección de categoría desde la base de datos -->
                    <label class="multiple">Categoría</label>
                    <div class="select-wrap">
                        <select name="categoria" required>

                            {% if categorias %}
                                {% for cat in categorias %}
                                    <option value="{{ cat.ID_CATEGORIA }}">{{ cat.ID_CATEGORIA }}</option>
                                {% endfor %}
                            {% else %}
                                <option value="">Sin categorías</option>
                            {% endif %}

                        </select>
                    </div>

                    <!-- Imagen opcional -->
                    <label>Imagen del objeto (opcional)</label>
                    <input type="file" id="imagen" name="imagen" accept="image/*">

                    <!-- Observaciones -->
                    <label>Comentario (opcional)</label>
                    <textarea name="comentario" maxlength="1000"
                        placeholder="Detalles adicionales"></textarea>

                </div>
            </div>

            <!-- botones del formulario -->
            <div class="btn-area">
                <button type="submit" class="btn-config">Publicar</button>
                <button type="reset" class="btn-config">Limpiar</button>
            </div>

            <!-- Área donde se mostrarán mensajes de éxito o error -->
            <div id="MensajeAlerta" style="margin-top:12px;"></div>

        </form>
    </div>

</div>

<!-- =========================
    enviar datos del formulario al backend con fetch
     ========================= -->
<script>

    // Obtener el formulario
    const form = document.getElementById('reportForm');

    // Obtener el formulario
    form.addEventListener('submit', async (e) => {

        // Evita que la página se recargue
        e.preventDefault();

        // Convertir los datos del formulario en FormData
        const formData = new FormData(form);

        const mensajeAlerta = document.getElementById('MensajeAlerta');

        try {

            // Mostrar mensaje de carga
            mensajeAlerta.innerHTML = 'Enviando reporte...';
            mensajeAlerta.style.color = '#006bb6';

            // Enviar datos al backend con fetch
            const response = await fetch('/submit_enc', {
                method: 'POST',
                body: formData
            });

            // Obtener respuesta como texto
            const text = await response.text();
            let result;

            // Intentar convertir la respuesta a JSON
            try {
                result = JSON.parse(text);
            } catch (err) {
                console.error("El servidor devolvió HTML en vez de JSON:", text);
                throw new Error("Error 500: La respuesta del servidor no es válida.");
            }

            // Verificar si hubo error en la respuesta
            if (result.error || !response.ok) {

                mensajeAlerta.innerHTML = result.mensaje || "Error al enviar los datos";
                mensajeAlerta.style.color = "red";
                console.error("Error:", result);

            } else {

                // Si el objeto ya estaba registrado
                if (result.existe) {

                    mensajeAlerta.innerHTML = result.mensaje;
                    mensajeAlerta.style.color = "orange";

                } else {

                    // Si el registro fue exitoso
                    mensajeAlerta.innerHTML = result.mensaje || "Reporte enviado correctamente";
                    mensajeAlerta.style.color = "green";

                    // Limpiar formulario
                    form.reset();

                    // Redirigir después de 2 segundos
                    setTimeout(() => {
                        window.location.href = '/menu';
                    }, 2000);

                }
            }

        } catch (error) {

            // Error general de conexión o servidor
            mensajeAlerta.innerHTML = "Error al enviar los datos: " + error.message;
            mensajeAlerta.style.color = "red";
            console.error("Error completo:", error);

        }
    });

</script>

{% endblock %}
